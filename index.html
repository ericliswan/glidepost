<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deliver parcels between floating islands on a glider." />
    <title>Glidepost</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Glidepost game view"></canvas>

    <div id="hud">
      <div class="top">
        <div id="timer">0.00</div>
        <div id="best"></div>
      </div>

      <div id="chain"></div>
      <div id="message" role="status" aria-live="polite"></div>

      <div class="readout left">
        <div><b id="speed">0</b> km/h</div>
        <div><b id="altitude">0</b> m</div>
      </div>

      <div class="boost">
        <div class="bar"><div id="boost-fill"></div></div>
        <span>Boost</span>
      </div>

      <div class="readout right">
        <div><b id="distance">0</b> m</div>
        <div>to the lighthouse</div>
      </div>
    </div>

    <div id="dialogue" hidden>
      <img id="portrait" alt="" />
      <div class="speech" aria-hidden="true">
        <div id="speaker"></div>
        <p><span id="written"></span><span id="unwritten"></span></p>
        <div class="hint">Space or click ▸</div>
      </div>
      <div id="spoken" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
